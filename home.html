// 🚀 INIT
async function init(){

  const { data } = await supabaseClient.auth.getSession();
  const user = data.session?.user;

  if(!user){
    window.location.href = "login.html";
    return;
  }

  loadUser(user.id);
  realtimeCoins(user.id);
}


// 👤 LOAD USER
async function loadUser(){

const { data: { user }, error: authError } =
await supabaseClient.auth.getUser();

if(authError || !user){
console.log("No user");
return;
}

const { data, error } = await supabaseClient
.from("users")
.select("name, coins")
.eq("id", user.id)   // ✅ UID nahi, ID use karo
.maybeSingle();

if(error){
console.log("FETCH ERROR:", error);
return;
}

if(!data){
document.getElementById("name").innerText = "Player";
document.getElementById("coins").innerText = "0";
return;
}

document.getElementById("name").innerText =
data.name || "Player";

document.getElementById("coins").innerText =
data.coins || 0;
}


// 🔴 REALTIME COINS
function realtimeCoins(uid){

  supabaseClient
    .channel("coins-channel")
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "users"
      },
      payload => {

        if(payload.new.uid === uid){
          document.getElementById("coins").innerText =
            payload.new.coins;
        }

      }
    )
    .subscribe();
}


// 🔗 NAVIGATION
function goTo(page){
  window.location.href = page;
}

init();
</script>

async function loadNotifications(){

const { data:{ user } } =
await supabaseClient.auth.getUser();

if(!user){
console.log("No user");
return;
}

const { data, error } =
await supabaseClient
.from("notifications")
.select("*")
.eq("uid", user.id)
.order("created_at", { ascending:false });

if(error){
console.log("LOAD ERROR:", error);
return;
}

const box =
document.getElementById("notificationList");

/* CLEAR FIRST */
box.innerHTML = "";

/* EMPTY STATE */
if(!data || data.length === 0){
box.innerHTML = "<p>No notifications</p>";
document.getElementById("notifCount").innerText = 0;
return;
}

/* RENDER */
data.forEach(n=>{

box.innerHTML +=` 
<div class="noti-card ${n.is_read ? "" : "unread"}">

<h4>${n.title}</h4>
<p>${n.message}</p>

<small>
${new Date(n.created_at).toLocaleString()}
</small>

</div>
`;

});

/* UNREAD COUNT */
const unread =
data.filter(n => !n.is_read).length;

document.getElementById("notifCount").innerText =
unread;

}

async function toggleNotifications(){

const box =
document.getElementById("notifDropdown");

if(box.style.display === "block"){

box.style.display = "none";

}else{

box.style.display = "block";

/* MARK AS READ */

const { data:{ user } } =
await supabaseClient.auth.getUser();

await supabaseClient
.from("notifications")
.update({ is_read:true })
.eq("uid", user.id);

/* RELOAD */
loadNotifications();

}

}
  supabaseClient
.channel("noti-live")
.on("postgres_changes", {
event:"INSERT",
schema:"public",
table:"notifications"
}, ()=>{

loadNotifications();

})

  async function giveWelcomeBonus(){

  const { data:{ user } } = await supabaseClient.auth.getUser();

  if(!user) return;

  let deviceId = localStorage.getItem("sonix_device_id");

  if(!deviceId){
    deviceId = crypto.randomUUID();
    localStorage.setItem("sonix_device_id", deviceId);
  }

  const { data:deviceClaim } = await supabaseClient
    .from("welcome_bonus_claims")
    .select("id")
    .eq("device_id", deviceId)
    .maybeSingle();

  if(deviceClaim){
    console.log("Bonus already claimed on this device");
    return;
  }

  const { data:userClaim } = await supabaseClient
    .from("welcome_bonus_claims")
    .select("id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(userClaim){
    console.log("User already claimed bonus");
    return;
  }

  const bonus = 5;

  const { data:userData, error:userError } = await supabaseClient
    .from("users")
    .select("coins")
    .eq("id", user.id)
    .maybeSingle();

  if(userError || !userData){
    console.log("USER ERROR:", userError);
    return;
  }

  const newCoins = Number(userData.coins || 0) + bonus;

  const { error:updateError } = await supabaseClient
    .from("users")
    .update({ coins:newCoins })
    .eq("id", user.id);

  if(updateError){
    console.log("COINS ERROR:", updateError);
    return;
  }

  const { error:claimError } = await supabaseClient
    .from("welcome_bonus_claims")
    .insert([{
      user_id:user.id,
      device_id:deviceId,
      amount:bonus
    }]);

  if(claimError){
    console.log("CLAIM ERROR:", claimError);
    return;
  }
    await supabaseClient
  .from("transactions")
  .insert([{
    user_id:user.id,
    type:"welcome_bonus",
    title:"🎁 Welcome Bonus",
    amount:bonus,
    status:"success",
    created_at:new Date().toISOString()
  }]);

  alert("🎁 Welcome Bonus Added: 5 Coins");
}
  
  loadUser();
  giveWelcomeBonus();
  
</script>
