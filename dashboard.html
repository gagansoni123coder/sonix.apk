  async function checkAdmin(){

  } = await client.auth.getUser();

    "admin-login.html";

    return;
  }

  const { data } =
  await client
  .from("users")
  .select("is_admin")
  .eq("id",user.id)
  .single();

    window.location.href =
    "admin-login.html";

  }

}
