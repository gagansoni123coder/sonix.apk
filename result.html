<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoniX Result</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#430000,#070707 50%,#000);
  color:#fff;
  padding:16px;
}

body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,#ff0000,transparent 65%);
  filter:blur(130px);
  opacity:.35;
  top:10%;
  left:10%;
  z-index:-1;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.back{
  background:#1a0000;
  border:1px solid #ff3333;
  color:#fff;
  padding:10px 14px;
  border-radius:14px;
  box-shadow:0 0 18px rgba(255,0,0,.45);
  cursor:pointer;
}

.title{
  text-align:center;
}

.title h1{
  font-size:24px;
  color:#ff3b3b;
  text-shadow:0 0 15px red;
}

.title p{
  font-size:12px;
  color:#bbb;
}

.banner{
  width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:16px;
  border:1px solid rgba(255,0,0,.45);
  box-shadow:0 0 25px rgba(255,0,0,.4);
}

.result-card{
  background:linear-gradient(145deg,#170000,#090909);
  border:1px solid rgba(255,0,0,.45);
  border-radius:22px;
  padding:18px;
  box-shadow:
    0 0 28px rgba(255,0,0,.35),
    inset 0 0 18px rgba(255,0,0,.12);
  margin-bottom:20px;
}

.match-title{
  font-size:24px;
  color:#ff4d4d;
  text-shadow:0 0 12px red;
  margin-bottom:6px;
}

.match-sub{
  color:#ff8a8a;
  font-weight:700;
  margin-bottom:15px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.box{
  background:#0d0d0d;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:14px;
}

.box small{
  color:#aaa;
  font-size:11px;
}

.box h3{
  margin-top:5px;
  font-size:16px;
}

.section-title{
  margin:25px 0 12px;
  color:#ff3b3b;
  text-shadow:0 0 12px red;
}

.table-box{
  overflow:hidden;
  border-radius:18px;
  border:1px solid rgba(255,0,0,.35);
  box-shadow:0 0 20px rgba(255,0,0,.25);
  margin-bottom:22px;
}

.table-head{
  background:linear-gradient(135deg,#330000,#ff003c);
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:900;
  text-shadow:0 0 10px red;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#101010;
}

th{
  background:#1d1d1d;
  color:#fff;
  padding:13px 8px;
  font-size:14px;
}

td{
  padding:13px 8px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  color:#eee;
  font-weight:600;
}

tr:hover{
  background:rgba(255,0,0,.08);
}

.rank{
  color:#ff4545;
  font-weight:900;
}

.empty,.loading{
  text-align:center;
  margin-top:80px;
  color:#ff4d4d;
  font-weight:800;
}

@media(max-width:600px){
  .info-grid{
    grid-template-columns:1fr;
  }

  th,td{
    font-size:13px;
    padding:11px 5px;
  }
}
</style>
</head>

<body>

<div class="header">
  <button class="back" onclick="history.back()">← Back</button>

  <div class="title">
    <h1>🏆 MATCH RESULT</h1>
    <p>SoniX Esports Final Scoreboard</p>
  </div>

  <div></div>
</div>

<div id="resultBox" class="loading">Loading result...</div>

<script>
const client = window.supabase.createClient(
  "https://ggkqsfkxmmusrmczoyuk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdna3FzZmt4bW11c3JtY3pveXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjg2NDIsImV4cCI6MjA5MDg0NDY0Mn0.p5Y2FFlNsFweZ2yc290eRs92mVKJTLnEU2C2y-qZZBI"
);

const params = new URLSearchParams(window.location.search);

const game =
params.get("game");

const resultId =
params.get("id");

async function loadResult(){

  const box =
  document.getElementById("resultBox");

  if(!game || !resultId){
    box.innerHTML = `
      <div class="empty">
        ❌ Result link invalid<br>
        game ya id missing hai
      </div>
    `;
    return;
  }

  const { data:result, error } =
  await client
    .from("match_results")
    .select("*")
    .eq("game_type", game)
    .eq("id", resultId)
    .maybeSingle();

  if(error){
    console.log("RESULT ERROR:", error);
    box.innerHTML =
    `<div class="empty">Result loading failed ❌</div>`;
    return;
  }

  if(!result){
    box.innerHTML = `
      <div class="empty">
        🚫 Result abhi publish nahi hua<br>
        Thoda wait karo warrior 🎮
      </div>
    `;
    return;
  }

  const winners =
  Array.isArray(result.winners)
  ? result.winners
  : [];

  const players =
  Array.isArray(result.players)
  ? result.players
  : [];

  box.className = "";

  box.innerHTML = `
    <div class="result-card">

      ${
        result.banner
        ? `<img src="${result.banner}" class="banner">`
        : ""
      }

      <h2 class="match-title">
        ${result.title || "Tournament Result"}
      </h2>

      <div class="match-sub">
        Match #${result.match_no || result.room_number || result.id}
      </div>

      <div class="info-grid">

        <div class="box">
          <small>ORGANISED ON</small>
          <h3>${result.organized_on || "-"}</h3>
        </div>

        <div class="box">
          <small>WINNING PRIZE</small>
          <h3>🪙 ${result.winning_prize || 0}</h3>
        </div>

        <div class="box">
          <small>PER KILL</small>
          <h3>🪙 ${result.per_kill || 0}</h3>
        </div>

        <div class="box">
          <small>ENTRY FEE</small>
          <h3>🪙 ${result.entry_fee || 0}</h3>
        </div>

        <div class="box">
          <small>MVP</small>
          <h3>🔥 ${result.mvp || "-"}</h3>
        </div>

        <div class="box">
          <small>TOP KILLER</small>
          <h3>💀 ${result.top_killer || "-"}</h3>
        </div>

        <div class="box">
          <small>TOTAL KILLS</small>
          <h3>⚔️ ${result.kills || 0}</h3>
        </div>

        <div class="box">
          <small>GAME TYPE</small>
          <h3>${result.game_type || "-"}</h3>
        </div>

      </div>
    </div>

    ${makeWinnerTable(winners)}

    ${makePlayerTable(players)}
  `;
}

function makeWinnerTable(winners){

  if(!winners || winners.length === 0){
    return `
      <h2 class="section-title">🏆 Winners</h2>
      <div class="empty">No winners added yet</div>
    `;
  }

  let rows = "";

  winners.forEach((w, index)=>{
    rows += `
      <tr>
        <td class="rank">${w.rank || index + 1}</td>
        <td>${w.name || "Player"}</td>
      </tr>
    `;
  });

  return `
    <h2 class="section-title">🏆 Winners</h2>

    <div class="table-box">
      <div class="table-head">Winner</div>

      <table>
        <tr>
          <th>#</th>
          <th>Player Name</th>
        </tr>

        ${rows}
      </table>
    </div>
  `;
}

function makePlayerTable(players){

  if(!players || players.length === 0){
    return `
      <h2 class="section-title">🔥 Player Ranking</h2>
      <div class="empty">No player ranking added yet</div>
    `;
  }

  players.sort((a,b)=>{
    return Number(a.rank || 999) - Number(b.rank || 999);
  });

  let rows = "";

  players.forEach((p,index)=>{
    rows += `
      <tr>
        <td class="rank">${p.rank || index + 1}</td>
        <td>${p.name || "Player"}</td>
        <td>${p.kills || 0}</td>
        <td>🪙 ${p.winning || 0}</td>
      </tr>
    `;
  });

  return `
    <h2 class="section-title">🔥 Player Ranking</h2>

    <div class="table-box">
      <div class="table-head">Match Result</div>

      <table>
        <tr>
          <th>#</th>
          <th>Player Name</th>
          <th>Kills</th>
          <th>Winning</th>
        </tr>

        ${rows}
      </table>
    </div>
  `;
}

/* REALTIME UPDATE */
client
.channel("result-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"match_results"
  },
  ()=>{
    loadResult();
  }
)
.subscribe();

loadResult();
</script>

</body>
  </html>
