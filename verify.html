<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Account</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body {
      background: #0b0f1a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    .box {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 20px #00ffcc;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #00ffcc;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Verify Your Account 🔐</h2>
  <p>Complete captcha to continue</p>

  <!-- CAPTCHA -->
  <div class="g-recaptcha" data-sitekey="6Ld88MosAAAAAA3kB0HN4OCjnq16tXLk0Flh09hn"></div>

  <br>
  <button onclick="checkUser()">Continue</button>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://ggkqsfkxmmusrmczoyuk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdna3FzZmt4bW11c3JtY3pveXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjg2NDIsImV4cCI6MjA5MDg0NDY0Mn0.p5Y2FFlNsFweZ2yc290eRs92mVKJTLnEU2C2y-qZZBI"
);

async function checkUser() {

  // CAPTCHA check
  const captcha = grecaptcha.getResponse();
  if (!captcha) {
    alert("Please complete captcha ❗");
    return;
  }

  // USER CHECK
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("❌ First verify from Gmail link!");
    return;
  }

  // EMAIL VERIFIED CHECK
  if (!user.email_confirmed_at) {
    alert("❌ Email not verified yet. Check Gmail!");
    return;
  }

  // ✅ SUCCESS
  alert("✅ Verified Successfully!");
  window.location.href = "index.html";
}
</script>

</body>
</html>
