<!DOCTYPE html>
<html>
<head>
  <title>SoniX Refer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
color:white;
min-height:100vh;
}

.page{
padding:20px;
}

.top-card{
background:#111;
border:2px solid red;
border-radius:25px;
padding:25px;
box-shadow:0 0 30px rgba(255,0,0,0.5);
}

.top-card h1{
color:#ff2d2d;
font-size:30px;
text-shadow:0 0 15px red;
}

.top-card p{
margin-top:5px;
color:#aaa;
}

.code-box{
margin-top:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#1a1a1a;
padding:15px;
border-radius:15px;
border:1px solid red;
}

.code-box span{
font-size:22px;
font-weight:bold;
}

button{
background:linear-gradient(45deg,#ff0000,#7a0000);
border:none;
padding:12px 18px;
border-radius:12px;
color:white;
font-weight:bold;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.create-box{
margin-top:15px;
}

.create-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#0d0d0d;
border:1px solid red;
color:white;
margin-bottom:10px;
}

.stats{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.card{
background:#111;
padding:20px;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,0,0,0.5);
box-shadow:0 0 15px rgba(255,0,0,0.2);
}

.card h2{
font-size:26px;
color:#ff3030;
}

.card p{
margin-top:5px;
font-size:13px;
color:#aaa;
}

.share-btn{
margin-top:20px;
width:100%;
}

.title{
margin-top:25px;
margin-bottom:15px;
color:#ff3030;
}

.ref-item{
background:#111;
padding:15px;
border-radius:14px;
margin-bottom:12px;
border-left:4px solid red;
}

.ref-item p{
margin-top:6px;
color:#aaa;
font-size:13px;
}
  .popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.popup-box{
  width:90%;
  max-width:380px;
  background:#111;
  border:2px solid red;
  border-radius:22px;
  padding:22px;
  text-align:center;
  box-shadow:0 0 35px rgba(255,0,0,0.7);
}

.popup-box h2{
  color:#ff2b2b;
  text-shadow:0 0 15px red;
  margin-bottom:12px;
}

.popup-note{
  color:#ff3333;
  font-size:13px;
  margin:15px 0;
}

.popup-buttons{
  display:flex;
  gap:12px;
}

.popup-buttons button{
  width:100%;
}

.cancel-btn{
  background:#333;
  box-shadow:none;
}

.confirm-btn{
  background:linear-gradient(45deg,#ff0000,#7a0000);
}
</style>
</head>

<body>

<div class="page">

  <div class="top-card">

    <h1>REFER & EARN</h1>
    <p>Invite friends and earn rewards</p>

    <div class="code-box">
      <span id="myCode">Loading...</span>
      <button onclick="copyCode()">COPY</button>
    </div>

    <div class="create-box">
      <input type="text" id="customCode" placeholder="Create Custom Code">
      <button onclick="createReferralCode()">Create Code</button>
    </div>

  </div>

  <div class="stats">

    <div class="card">
      <h2 id="totalRefs">0</h2>
      <p>Total Referrals</p>
    </div>

    <div class="card">
      <h2 id="successRefs">0</h2>
      <p>Successful</p>
    </div>

    <div class="card">
      <h2 id="earnings">₹0</h2>
      <p>Earnings</p>
    </div>

  </div>

  <button class="share-btn" onclick="shareCode()">
    Share On WhatsApp
  </button>

  <h2 class="title">Recent Referrals</h2>

  <div id="refList"></div>

</div>
<script>

const SUPABASE_URL = "https://ggkqsfkxmmusrmczoyuk.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdna3FzZmt4bW11c3JtY3pveXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjg2NDIsImV4cCI6MjA5MDg0NDY0Mn0.p5Y2FFlNsFweZ2yc290eRs92mVKJTLnEU2C2y-qZZBI";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

loadUser();

async function loadUser(){

  const {
    data: { user }
  } = await db.auth.getUser();

  if(!user){
    alert("Please Login First");
    return;
  }

  currentUser = user;

  loadMyReferralCode();
  loadReferralStats();
  listenLiveReferrals();

}

async function loadMyReferralCode(){

  const { data, error } = await db
  .from("users")
  .select("referral_code")
  .eq("id", currentUser.id)
  .single();

  if(error){
    console.log(error);
    return;
  }

  if(data?.referral_code){
    document.getElementById("myCode").innerText =
    data.referral_code;
  }
  else{
    document.getElementById("myCode").innerText =
    "NO CODE";
  }

}

async function createReferralCode(){

  const input = document.getElementById("customCode");
  let code = input.value.trim().toUpperCase();

  if(code.length < 4){
    alert("Code minimum 4 letters ka hona chahiye");
    return;
  }

  code = code.replace(/\s/g, "");

  pendingReferralCode = code;

  document.getElementById("confirmText").innerText =
  `Are you sure to make "${code}" your refer code?`;

  document.getElementById("confirmPopup").style.display = "flex";
}

function copyCode(){

  const code =
  document.getElementById("myCode").innerText;

  navigator.clipboard.writeText(code);

  alert("Code Copied");

}

function shareCode(){

  const code =
  document.getElementById("myCode").innerText;

  const text =
  `Join SoniX Esports using my referral code: ${code}`;

  window.open(
    `https://wa.me/?text=${encodeURIComponent(text)}`
  );

}

async function loadReferralStats(){

  const { data: refs } = await db
  .from("referrals")
  .select("*")
  .eq("referrer_id", currentUser.id);

  const { data: earnings } = await db
  .from("referral_earnings")
  .select("commission_amount")
  .eq("referrer_id", currentUser.id);

  const totalRefs =
  refs?.length || 0;

  const successRefs =
  refs?.filter(r =>
    r.status === "successful"
  ).length || 0;

  const totalEarn =
  earnings?.reduce((sum, item)=>
    sum + Number(item.commission_amount),
  0) || 0;

  document.getElementById("totalRefs").innerText =
  totalRefs;

  document.getElementById("successRefs").innerText =
  successRefs;

  document.getElementById("earnings").innerText =
  "₹" + totalEarn;

  let html = "";

  refs?.forEach(ref => {

    html += `
      <div class="ref-item">
        <b>Status: ${ref.status}</b>
        <p>Matches Joined:
        ${ref.join_count}/${ref.required_joins}</p>

        <p>Code Used:
        ${ref.referral_code}</p>
      </div>
    `;

  });

  document.getElementById("refList").innerHTML =
  html;

}

function listenLiveReferrals(){

  db
  .channel("live-referrals")

  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "referrals",
      filter: `referrer_id=eq.${currentUser.id}`
    },

    () => {
      loadReferralStats();
    }

  )

  .subscribe();

}
function cancelReferralPopup(){
  pendingReferralCode = "";
  document.getElementById("confirmPopup").style.display = "none";
}

async function confirmReferralCode(){

  const code = pendingReferralCode;

  if(!code){
    return;
  }

  const { data: existing } = await db
    .from("users")
    .select("id")
    .eq("referral_code", code)
    .maybeSingle();

  if(existing){
    alert("Ye code already used hai");
    cancelReferralPopup();
    return;
  }

  const { error } = await db
    .from("users")
    .update({ referral_code: code })
    .eq("id", currentUser.id);

  if(error){
    console.log(error);
    alert("Error saving code");
    return;
  }

  document.getElementById("myCode").innerText = code;
  document.querySelector(".create-box").style.display = "none";

  cancelReferralPopup();

  alert("Referral Code Created Permanently");
}
    </script>
  
  <div id="confirmPopup" class="popup-overlay">
  <div class="popup-box">
    <h2>Confirm Refer Code</h2>

    <p id="confirmText"></p>

    <p class="popup-note">
      Note: Refer code will be created only one time. You can't change/edit it later.
    </p>

    <div class="popup-buttons">
      <button class="cancel-btn" onclick="cancelReferralPopup()">Cancel</button>
      <button class="confirm-btn" onclick="confirmReferralCode()">Confirm</button>
    </div>
  </div>
  </div>
</body>
</html>
