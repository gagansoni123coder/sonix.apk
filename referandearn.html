<!DOCTYPE html>
<html>
<head>
  <title>SoniX Refer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
color:white;
min-height:100vh;
}

.page{
padding:20px;
}

.top-card{
background:#111;
border:2px solid red;
border-radius:25px;
padding:25px;
box-shadow:0 0 30px rgba(255,0,0,0.5);
}

.top-card h1{
color:#ff2d2d;
font-size:30px;
text-shadow:0 0 15px red;
}

.top-card p{
margin-top:5px;
color:#aaa;
}

.code-box{
margin-top:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#1a1a1a;
padding:15px;
border-radius:15px;
border:1px solid red;
}

.code-box span{
font-size:22px;
font-weight:bold;
}

button{
background:linear-gradient(45deg,#ff0000,#7a0000);
border:none;
padding:12px 18px;
border-radius:12px;
color:white;
font-weight:bold;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.create-box{
margin-top:15px;
}

.create-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#0d0d0d;
border:1px solid red;
color:white;
margin-bottom:10px;
}

.stats{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.card{
background:#111;
padding:20px;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,0,0,0.5);
box-shadow:0 0 15px rgba(255,0,0,0.2);
}

.card h2{
font-size:26px;
color:#ff3030;
}

.card p{
margin-top:5px;
font-size:13px;
color:#aaa;
}

.share-btn{
margin-top:20px;
width:100%;
}

.title{
margin-top:25px;
margin-bottom:15px;
color:#ff3030;
}

.ref-item{
background:#111;
padding:15px;
border-radius:14px;
margin-bottom:12px;
border-left:4px solid red;
}

.ref-item p{
margin-top:6px;
color:#aaa;
font-size:13px;
}
</style>
</head>

<body>

<div class="page">

  <div class="top-card">

    <h1>REFER & EARN</h1>
    <p>Invite friends and earn rewards</p>

    <div class="code-box">
      <span id="myCode">Loading...</span>
      <button onclick="copyCode()">COPY</button>
    </div>

    <div class="create-box">
      <input type="text" id="customCode" placeholder="Create Custom Code">
      <button onclick="createReferralCode()">Create Code</button>
    </div>

  </div>

  <div class="stats">

    <div class="card">
      <h2 id="totalRefs">0</h2>
      <p>Total Referrals</p>
    </div>

    <div class="card">
      <h2 id="successRefs">0</h2>
      <p>Successful</p>
    </div>

    <div class="card">
      <h2 id="earnings">₹0</h2>
      <p>Earnings</p>
    </div>

  </div>

  <button class="share-btn" onclick="shareCode()">
    Share On WhatsApp
  </button>

  <h2 class="title">Recent Referrals</h2>

  <div id="refList"></div>

</div>

  
</body>
</html>
