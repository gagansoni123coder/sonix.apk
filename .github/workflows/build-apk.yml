name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create package.json
        run: |
          echo '{
            "name": "sonix",
            "version": "1.0.0"
          }' > package.json

      - name: Install dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/assets --save-dev

      - name: Create WWW folder
        run: |
          mkdir www
          cp *.html www/ || true
          cp *.css www/ || true
          cp *.js www/ || true
          cp -r assets www/assets || true
          cp -r images www/images || true

      - name: Init Capacitor
        run: |
          npx cap init "SoniX Esports" "com.sonix.esports" --web-dir=www

      - name: Add Android
        run: |
          npx cap add android

      - name: Generate App Icon
        run: |
          npx capacitor-assets generate --android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Set Login Page
        run: |
          cp login.html www/index.html || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonix-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
