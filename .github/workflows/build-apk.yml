name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          echo '{
            "name":"sonix",
            "version":"1.0.0",
            "dependencies":{
              "@capacitor/core":"latest",
              "@capacitor/cli":"latest",
              "@capacitor/android":"latest"
            }
          }' > package.json

      - name: Install dependencies
        run: npm install

      - name: Create WWW folder
        run: |
          mkdir -p www
          cp -r *.html www/ || true
          cp -r *.css www/ || true
          cp -r *.js www/ || true
          cp -r *.json www/ || true
          cp -r assets www/assets || true
          cp -r images www/images || true
          cp -r img www/img || true

      - name: Init Capacitor
        run: npx cap init "SoniX Esports" "com.sonix.esports" --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonix-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
